<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>vid-force · Home</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101820; color: #f4f1ea; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    main { width: min(760px, 100%); } .eyebrow { color: #86d8c2; text-transform: uppercase; letter-spacing: .18em; font-size: .78rem; font-weight: 700; }
    h1 { font-size: clamp(3rem, 10vw, 6.5rem); letter-spacing: -.07em; line-height: .95; margin: 1rem 0; }
    p { max-width: 38rem; color: #b7c2c7; font-size: clamp(1.05rem, 2vw, 1.25rem); line-height: 1.7; }
    a { display: inline-block; margin-top: 1.25rem; padding: .85rem 1.1rem; border: 1px solid #86d8c2; border-radius: 999px; color: #86d8c2; text-decoration: none; }
    a:hover { background: #86d8c2; color: #101820; } footer { margin-top: 5rem; color: #73838a; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Hello, world</div>
    <h1>Welcome to<br>vid-force.</h1>
    <p>This is my corner of the internet. I’m getting things ready here—more soon.</p>
    <a href="https://github.com/vid-force">Find me on GitHub ↗</a>
    <footer>Built with GitHub Pages</footer>
  </main>
</body>
</html>
